name: Set up plugins workspace
description: Install pnpm and Node (versions from plugins/package.json and plugins/.nvmrc) and the plugins/ workspace dependencies. Check out the repo first.

runs:
  using: 'composite'
  steps:
    # package_json_file is relative to the workspace root; composite steps
    # ignore the caller's defaults.run.working-directory.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: plugins/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: plugins/.nvmrc
        cache: 'pnpm'
        cache-dependency-path: plugins/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: plugins
      run: pnpm install --frozen-lockfile --prefer-offline
