name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled, but main is not: cancelling there would
  # leave the merged commit without a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes back to the repo
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm action uses the packageManager field in plugins/package.json to
      # understand which version to install. package_json_file is relative
      # to the workspace root, not affected by defaults.run.working-directory.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: plugins/package.json
      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: plugins/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test:ci
      # Builds what each package publishes, per its plugin-ci.json (or the
      # implicit src/plugin.json + `build` target), rather than every
      # package's `build` script. Sequential: targets of one package share
      # dist/, so they cannot build concurrently.
      - name: Discover build targets
        id: targets
        uses: $/.github/actions/discover-plugins
      - name: Build
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          count="$(jq 'length' <<<"$TARGETS")"
          for ((i = 0; i < count; i++)); do
            dir="$(jq -r ".[$i].dir" <<<"$TARGETS")"
            pkg="$(jq -r ".[$i].pkg" <<<"$TARGETS")"
            id="$(jq -r ".[$i].id" <<<"$TARGETS")"
            script="$(jq -r ".[$i].script" <<<"$TARGETS")"

            echo "::group::$pkg → $id"
            # `^...` builds the package's workspace dependencies but not the
            # package itself; exits 0 when it has none.
            pnpm turbo run build --filter "$pkg^..."
            pnpm --filter "$pkg" run "$script"
            built="$(jq -r '.id // ""' "$GITHUB_WORKSPACE/$dir/dist/plugin.json")"
            echo "::endgroup::"

            if [ "$built" != "$id" ]; then
              echo "::error file=$dir/dist/plugin.json::$pkg script '$script' built '$built', expected '$id'"
              exit 1
            fi
          done
