name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are canceled, but main is not: canceling there would
  # leave the merged commit without a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes back to the repo
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: $/.github/actions/setup-workspace

      # Replays format/lint/type-check/test results for packages whose inputs
      # didn't change. Correct only while turbo.json's task inputs cover every
      # file a task reads, so leave them at turbo's default (all files in the
      # package) plus globalDependencies, not narrowed to src/. Keyed per
      # commit and restored from the newest entry for the same lockfile; a PR's
      # entries are scoped to its branch, so they never feed main.
      - name: Cache turbo results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/.turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('plugins/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('plugins/pnpm-lock.yaml') }}-

      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test:ci
      # Builds what each package publishes, per its plugin-ci.json (or the
      # implicit src/plugin.json + `build` target), rather than every
      # package's `build` script. Sequential: targets of one package share
      # dist/, so they cannot build concurrently.
      - name: Discover build targets
        id: targets
        uses: $/.github/actions/discover-plugins
      - name: Build
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/build-targets.sh"
