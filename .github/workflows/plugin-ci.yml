# Per-plugin CI beyond root ci.yml's format/lint/type-check/test/build:
# levitate API compatibility for every build target, and Playwright e2e for
# every package with an e2e suite. Both lists come from discover-plugins
# (see plugin-ci.json in CLAUDE.md), limited to packages this change touches.
name: Plugin CI

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/actions/discover-plugins/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/workflows/plugin-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.github/actions/discover-plugins/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/workflows/plugin-e2e.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are canceled, but main is not: canceling there would
  # leave the merged commit without a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.find.outputs.targets }}
      e2e: ${{ steps.find.outputs.e2e }}
    steps:
      # Full history: changed-only diffs against the PR base / previous commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: find
        uses: $/.github/actions/discover-plugins
        with:
          changed-only: 'true'

  compatibility:
    name: compatibility (${{ matrix.target.id }})
    needs: discover
    if: github.event_name == 'pull_request' && needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # Read-only: this job runs PR code (install scripts, the build) and an
    # unpinned levitate from npm. Commenting happens in compatibility-report,
    # which runs none of that.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: plugins/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: plugins/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: plugins
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        working-directory: plugins
        env:
          PKG: ${{ matrix.target.pkg }}
          SCRIPT: ${{ matrix.target.script }}
        run: |
          pnpm turbo run build --filter "$PKG^..."
          pnpm --filter "$PKG" run "$SCRIPT"

      - name: Find module
        id: module
        env:
          DIR: ${{ matrix.target.dir }}
          PLUGIN_JSON: ${{ matrix.target.plugin_json }}
        run: bash .github/scripts/find-module.sh

      # Module paths are repo-root-relative, which is where the action runs levitate.
      # Non-blocking: levitate flags any type change in a used export (e.g.
      # @grafana/runtime `config`), most of which don't break at run time. The
      # steps below turn a failure into a warning annotation and a PR comment
      # instead; delete continue-on-error to make it blocking. The action's own
      # comment-pr stays off because its sticky comment has no per-target key,
      # so matrix legs would overwrite each other; ours is keyed per plugin id.
      - name: Compatibility check
        id: compat
        continue-on-error: true
        uses: grafana/plugin-actions/is-compatible@4698961fa64137fcac207108397ebe8a738a33d1 # is-compatible/v1.0.3
        with:
          module: ${{ steps.module.outputs.path }}
          comment-pr: 'no'
          fail-if-incompatible: 'yes'

      - name: Warn on possible incompatibility
        if: steps.compat.outcome == 'failure'
        env:
          ID: ${{ matrix.target.id }}
          MODULE: ${{ steps.module.outputs.path }}
        run: echo "::warning title=Grafana API compatibility ($ID)::$MODULE may be incompatible with the latest @grafana/* packages; see the levitate output in the Compatibility check step"

      # Hands compatibility-report either the comment body or a `clean` marker.
      # The action leaves levitate's console report in .levitate_output.
      - name: Write compatibility report
        if: steps.compat.outcome == 'failure' || steps.compat.outcome == 'success'
        env:
          OUTCOME: ${{ steps.compat.outcome }}
          ID: ${{ matrix.target.id }}
          MODULE: ${{ steps.module.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p levitate-report
          if [ "$OUTCOME" = failure ]; then
            bash .github/scripts/levitate-comment.sh .levitate_output levitate-report/comment.md
          else
            touch levitate-report/clean
          fi

      - name: Upload compatibility report
        if: steps.compat.outcome == 'failure' || steps.compat.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: levitate-${{ matrix.target.id }}
          path: levitate-report/
          retention-days: 5

  # Posts (or, once clean, removes) each target's levitate comment. Holds the
  # PR write token, so it checks out nothing and runs no PR code: it only
  # reads the text artifact compatibility wrote. On fork PRs the token is
  # read-only regardless; the comment steps are continue-on-error, so this
  # job stays green there without commenting.
  compatibility-report:
    name: compatibility report (${{ matrix.target.id }})
    needs: [discover, compatibility]
    # always(): one target's failed build must not drop the other targets' reports.
    if: always() && github.event_name == 'pull_request' && needs.discover.result == 'success' && needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      # Missing when compatibility didn't get as far as levitate; then neither
      # step below runs and any earlier comment is left as it was.
      - name: Download compatibility report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: levitate-${{ matrix.target.id }}
          path: levitate-report

      - name: Comment compatibility report
        if: hashFiles('levitate-report/comment.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: levitate-${{ matrix.target.id }}
          path: levitate-report/comment.md

      # A later clean run removes this plugin's earlier report, so it can't go stale.
      - name: Remove stale compatibility report
        if: hashFiles('levitate-report/clean') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: levitate-${{ matrix.target.id }}
          delete: true

  e2e:
    name: e2e (${{ matrix.package.pkg }})
    needs: discover
    if: needs.discover.outputs.e2e != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.e2e) }}
    uses: $/.github/workflows/plugin-e2e.yml
    with:
      dir: ${{ matrix.package.dir }}
      pkg: ${{ matrix.package.pkg }}
      url: ${{ matrix.package.url }}
      grafana-dependency: ${{ matrix.package.grafana_dependency }}
