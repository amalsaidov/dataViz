name: 'Close stale issues and PRs'

# Ported from grafana/clock-panel's stale.yml during the monorepo import.
# Unlike clock-panel-i18n-verify.yml, this cannot be `paths:`-scoped to a single
# plugin: it is schedule-triggered and operates on issues/PRs, not on changed
# files. It therefore applies repo-wide, across every plugin in the monorepo.
# Apply the `no stalebot` label to exempt an individual issue or PR.

on:
  schedule:
    - cron: '30 4 * * *'

permissions: {}

concurrency:
  # A long run must not overlap the next night's, since both mutate labels.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # actions/stale has no author- or org-based exemption input, so PRs opened by
  # grafana org members are exempted by labeling them before the stale job runs.
  # `author_association` is computed by GitHub and needs no scopes beyond the
  # default token -- unlike the org membership API, which requires read:org.
  #
  # This deliberately runs on the same schedule rather than per-PR: labeling on
  # `pull_request_target` would need a write-scoped token on a dangerous trigger,
  # which the org's zizmor policy rejects.
  exempt-members:
    name: Exempt org members' PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # read open PRs' author_association, add the exemption label
    steps:
      - name: Label org members' open PRs as exempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[]
                  | select(.author_association == "MEMBER" or .author_association == "OWNER")
                  | select([.labels[].name] | index("no stalebot") | not)
                  | .number' \
          | while read -r pr; do
              echo "Exempting #${pr}"
              gh pr edit "${pr}" --repo "${REPO}" --add-label 'no stalebot'
            done

  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    needs: exempt-members
    permissions:
      issues: write # label and close stale issues
      pull-requests: write # label and close stale PRs
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Number of days of inactivity before an Issue or Pull Request becomes stale
          days-before-stale: 90
          # Number of days of inactivity before a stale Issue or Pull Request is closed.
          # Set to -1 to disable. If disabled, issues still need to be closed manually, but will remain marked as stale.
          days-before-close: 60
          exempt-issue-labels: no stalebot
          exempt-pr-labels: no stalebot
          operations-per-run: 100
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in the last 90 days. It will be closed in 60 days if no further activity occurs.
            Please feel free to give a status update or re-open when it's ready.
            Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed because it has not had
            activity in the last 60 days since being marked stale. Please feel free to
            re-open it if it is still relevant. Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            activity in the last 90 days. It will be closed in 60 days if no further activity occurs. Please
            feel free to give a status update now, ping for review, or re-open when it's ready.
            Thank you for your contributions!
          close-pr-message: >
            This pull request has been automatically closed because it has not had
            activity in the last 60 days since being marked stale. Please feel free to give a status
            update now, ping for review, or re-open when it's ready.
            Thank you for your contributions!
