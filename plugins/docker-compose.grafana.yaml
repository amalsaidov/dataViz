# A single Grafana instance that attaches to the shared plugin build produced
# by the plugin stack (docker-compose.yaml / `pnpm run plugin`).
#
# Run one instance per Compose project so multiple versions/ports can coexist,
# each sharing the same read-only plugin dist but with its own Grafana data:
#
#   GRAFANA_VERSION=13.1.0 GRAFANA_PORT=3002 pnpm run server
#   GRAFANA_VERSION=12.4.5 GRAFANA_PORT=3003 pnpm run server
services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-grafana-dataviz-${GRAFANA_PORT:-3001}}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    # Grafana scans plugins only once at startup. If it starts before the plugin
    # build finishes, the app is marked "not installed" and its pages 404 until a
    # restart. Since this stack runs in a separate Compose project it can't use
    # `depends_on` on the plugin build, so gate startup on the build artifacts
    # (frontend module.js AND a linux backend binary) appearing in the volume.
    # ($$ escapes $ so Compose passes it through to the shell.)
    entrypoint:
      - sh
      - -c
      - |
        dir=/var/lib/grafana/plugins/grafana-workspace-app
        echo "Waiting for plugin build (frontend + backend) in $$dir ..."
        until [ -f "$$dir/plugin.json" ] && [ -f "$$dir/module.js" ] && ls "$$dir"/grafana-workspace_linux_* >/dev/null 2>&1; do
          sleep 2
        done
        echo "Plugin build detected. Starting Grafana."
        exec /run.sh
    volumes:
      # Shared, read-only: every Grafana instance reads the same plugin build.
      - workspace-plugin-dist:/var/lib/grafana/plugins/grafana-workspace-app:ro
      - ./provisioning:/etc/grafana/provisioning
      # Per-instance Grafana data (project-scoped, not shared across instances).
      - workspace-data-grafana:/var/lib/grafana
    environment:
      # Grafana settings
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-workspace-app

      # Enable debug logging
      GF_LOG_LEVEL: debug

      # Development mode
      GF_DEFAULT_APP_MODE: development

volumes:
  # Provided by the plugin stack (docker-compose.yaml). Must exist before
  # starting Grafana, i.e. run `pnpm run plugin` first.
  workspace-plugin-dist:
    external: true
    name: workspace-plugin-dist
  # Project-scoped so each Grafana instance gets its own isolated data.
  workspace-data-grafana:
