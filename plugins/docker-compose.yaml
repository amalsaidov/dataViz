# This stack builds the plugin once and watches for changes, writing the
# compiled output into the shared `workspace-panel-dist` volume. Grafana
# instances (see docker-compose.grafana.yaml / `pnpm run server`) attach to
# that same volume, so a single build is shared across many Grafana containers.
services:
  plugin-precache:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app/workspace
      - workspace-panel-dist:/app/workspace/packages/@plugins/grafana-workspace-panel/dist/
      - clock-panel-dist:/app/workspace/packages/@plugins/grafana-clock-panel/dist/
      - workspace-node-modules:/app/workspace/node_modules/
      - workspace-pnpm-store:/root/.local/share/pnpm/store
    working_dir: /app/workspace
    # workspace-node-modules is a named volume: Docker seeds it from the image
    # only on first creation, so after a lockfile change it would keep serving
    # the old install. Re-sync it before building (fast — the store is a volume).
    command: sh -c "pnpm install --frozen-lockfile && pnpm build"

  plugin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      plugin-precache:
        condition: service_completed_successfully
    ports:
      - '35729:35729' # live reload port
    volumes:
      - ./:/app/workspace
      - workspace-panel-dist:/app/workspace/packages/@plugins/grafana-workspace-panel/dist/
      - clock-panel-dist:/app/workspace/packages/@plugins/grafana-clock-panel/dist/
      - workspace-node-modules:/app/workspace/node_modules/
      - workspace-pnpm-store:/root/.local/share/pnpm/store
    working_dir: /app/workspace
    command: pnpm dev
    healthcheck:
      # Report healthy only once the plugin's frontend build artifacts exist, so
      # consumers know the plugin is loadable by Grafana.
      test: >-
        test -f /app/workspace/packages/@plugins/grafana-workspace-panel/dist/plugin.json &&
        test -f /app/workspace/packages/@plugins/grafana-workspace-panel/dist/module.js &&
        test -f /app/workspace/packages/@plugins/grafana-clock-panel/dist/plugin.json &&
        test -f /app/workspace/packages/@plugins/grafana-clock-panel/dist/module.js
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  workspace-node-modules:
  workspace-pnpm-store:
  # Fixed name so Grafana stacks in other Compose projects can attach to the
  # same volume as an external volume (see docker-compose.grafana.yaml).
  workspace-panel-dist:
    name: workspace-panel-dist
  clock-panel-dist:
    name: clock-panel-dist

networks:
  default:
    name: workspace
