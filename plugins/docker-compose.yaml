# This stack builds the plugin once and watches for changes, writing the
# compiled output into the shared `workspace-plugin-dist` volume. Grafana
# instances (see docker-compose.grafana.yaml / `pnpm run server`) attach to
# that same volume, so a single build is shared across many Grafana containers.
services:
  plugin-precache:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app/workspace
      - workspace-plugin-dist:/app/workspace/packages/@plugins/grafana-workspace-app/dist/
      - workspace-panel-dist:/app/workspace/packages/@plugins/grafana-workspace-panel/dist/
      - workspace-node-modules:/app/workspace/node_modules/
      - workspace-pnpm-store:/root/.local/share/pnpm/store
    working_dir: /app/workspace
    command: sh -c "pnpm build"

  plugin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      plugin-precache:
        condition: service_completed_successfully
    ports:
      - '35729:35729' # live reload port
    volumes:
      - ./:/app/workspace
      - workspace-plugin-dist:/app/workspace/packages/@plugins/grafana-workspace-app/dist/
      - workspace-panel-dist:/app/workspace/packages/@plugins/grafana-workspace-panel/dist/
      - workspace-node-modules:/app/workspace/node_modules/
      - workspace-pnpm-store:/root/.local/share/pnpm/store
    working_dir: /app/workspace
    command: pnpm dev
    healthcheck:
      # Report healthy only once each plugin's frontend build artifacts exist, so
      # consumers know the plugins are loadable by Grafana.
      test: >-
        test -f /app/workspace/packages/@plugins/grafana-workspace-app/dist/plugin.json &&
        test -f /app/workspace/packages/@plugins/grafana-workspace-app/dist/module.js &&
        test -f /app/workspace/packages/@plugins/grafana-workspace-panel/dist/plugin.json &&
        test -f /app/workspace/packages/@plugins/grafana-workspace-panel/dist/module.js
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  workspace-node-modules:
  workspace-pnpm-store:
  # Fixed names so Grafana stacks in other Compose projects can attach to the
  # same volumes as external volumes (see docker-compose.grafana.yaml).
  workspace-plugin-dist:
    name: workspace-plugin-dist
  workspace-panel-dist:
    name: workspace-panel-dist

networks:
  default:
    name: workspace
