apiVersion: 1

# Loads any dashboard JSON in this folder. The example dashboard renders the
# grafana-workspace-panel plugin with TestData DB, so `pnpm run server` shows
# the panel with data immediately.
providers:
  - name: Workspace
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
